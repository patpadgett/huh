name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linter
        run: python -m pip install --quiet --upgrade pip ruff
      - name: Lint for syntax errors and undefined names
        run: ruff check --select E9,F .

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Install and smoke the console script
        run: |
          python -m pip install --quiet .
          huh --version
          huh 1696500000
          printf '%s' 'SGVsbG8=' | huh
          huh --json 137 > /dev/null

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --quiet --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/huh-venv
          /tmp/huh-venv/bin/python -m pip install --quiet dist/*.whl
          /tmp/huh-venv/bin/huh --version
          /tmp/huh-venv/bin/huh 1696500000 | grep -q "epoch seconds"
