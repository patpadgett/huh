[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsthis"
version = "0.1.0"
description = "huh: what is this string? Ranked readings of timestamps, tokens, cron lines, modes, hashes, colours and addresses - offline, with the Unix one-liner that reproduces each answer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Patrick Padgett" }]
keywords = ["cli", "decode", "epoch", "cron", "jwt", "base64", "chmod", "uuid", "cidr", "terminal", "developer-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Utilities",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/patpadgett/huh"
Issues = "https://github.com/patpadgett/huh/issues"

[project.scripts]
huh = "huh:main"

[tool.setuptools]
py-modules = ["huh"]
